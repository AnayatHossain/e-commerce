version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  intl: any
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.12.1
